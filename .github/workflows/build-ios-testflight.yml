name: Build iOS App (TestFlight)

on:
  push:
    branches: ["main"]
    paths:
      - "ios_app/**"
      - ".github/workflows/build-ios-testflight.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect Xcode & Install XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec ios_app/project.yml

      - name: Validate Plists & Opaque 1024x1024 RGB AppIcon
        run: |
          set -euo pipefail
          plutil -lint ios_app/Sources/Info.plist
          plutil -lint ios_app/Resources/PrivacyInfo.xcprivacy
          ICON_PATH="ios_app/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -f "$ICON_PATH"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_PATH" | tee /tmp/icon_info.txt
          grep -q "pixelWidth: 1024" /tmp/icon_info.txt
          grep -q "pixelHeight: 1024" /tmp/icon_info.txt
          grep -q "hasAlpha: no" /tmp/icon_info.txt

      - name: Stage 1 - Compile Verification (iOS Simulator & Generic arm64 Archive)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios_app/JTScreenwriter.xcodeproj \
            -scheme JTScreenwriter \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          xcodebuild \
            -project ios_app/JTScreenwriter.xcodeproj \
            -scheme JTScreenwriter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/JTScreenwriter_unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          test -d /tmp/JTScreenwriter_unsigned.xcarchive/Products/Applications/JTScreenwriter.app
          echo "Stage 1 iOS native build & archive verified cleanly."

      - name: Stage 2 - Sign, Export IPA & Upload to TestFlight (when Apple secrets present)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_DIST_CERT_P12_BASE64" ] || [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_PRIVATE_KEY" ]; then
            echo "Apple Developer secrets not configured yet; skipping TestFlight upload."
            echo "Run tools/jt_ios_setup.py once your Apple Developer account is ready."
            exit 0
          fi

          mkdir -p ~/.appstoreconnect/private_keys /tmp/jt-ios-build
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          KC_PATH=/tmp/jt-ios-build/build.keychain-db
          KC_PASS="jt-temp-kc-$(date +%s)"
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          printf '%s' "$APPLE_DIST_CERT_P12_BASE64" | base64 --decode > /tmp/jt-ios-build/dist.p12
          security import /tmp/jt-ios-build/dist.p12 -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC_PATH"
          security list-keychains -d user -s "$KC_PATH" login.keychain-db

          python3 -c 'import os, plistlib; open("/tmp/jt-ios-build/ExportOptions.plist","wb").write(plistlib.dumps({"destination":"export","method":"app-store-connect","signingStyle":"automatic","teamID":os.environ["APPLE_TEAM_ID"],"stripSwiftSymbols":True}))'

          xcodebuild \
            -project ios_app/JTScreenwriter.xcodeproj \
            -scheme JTScreenwriter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/jt-ios-build/JTScreenwriter.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive

          xcodebuild -exportArchive \
            -archivePath /tmp/jt-ios-build/JTScreenwriter.xcarchive \
            -exportPath /tmp/jt-ios-build/export \
            -exportOptionsPlist /tmp/jt-ios-build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          IPA_FILE="$(find /tmp/jt-ios-build/export -name '*.ipa' | head -n 1)"
          test -f "$IPA_FILE"
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          echo "Uploaded $IPA_FILE to App Store Connect / TestFlight."

      - name: Upload Unsigned Simulator & Archive Metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JTScreenwriter-iOS-Build-Check
          path: /tmp/icon_info.txt