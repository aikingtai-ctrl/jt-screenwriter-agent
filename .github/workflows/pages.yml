name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Stage clean _site and verify Pages budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          rsync -a --exclude='.git' --exclude='.github' --exclude='tools' --exclude='scripts' --exclude='android_app' --exclude='downloads' ./ _site/
          LATEST_TAG="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -n "${LATEST_TAG}" ]; then
            gh release download "${LATEST_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern 'JT-Screenwriter-Android.apk' --pattern 'SHA256SUMS.txt' -D _site/downloads --clobber || true
          fi
          test ! -f _site/data/workbench_data.json
          touch _site/.nojekyll
          total_bytes="$(du -sb _site | awk '{print $1}')"
          echo "Staged _site bytes: ${total_bytes}"
          if [ "${total_bytes}" -ge 996147200 ]; then
            echo "_site exceeded 950 MiB safety threshold: ${total_bytes}" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5